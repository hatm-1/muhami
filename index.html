<style>
/* Layout: full-bleed background scene, frosted cards over it, fixed bottom tab bar; one deliberate dark-glass look */
:root{
  color-scheme:dark;
  --base:#101514; --glass:rgba(20,24,25,.68); --glass-hi:rgba(32,37,38,.84); --sheet:#1C2122; --field:#262C2D;
  --ink:#F2F5F4; --muted:#A9B3AF; --faint:rgba(255,255,255,.09);
  --accent:#72DDB4; --on-accent:#0A2A1E; --warm:#F5A86E; --star:#F7C95E; --danger:#FF8C7C;
  --c-work:#86A9F0; --c-study:#B497EC; --c-home:#E6B460; --c-health:#6BD3A0; --c-me:#EE8DAA;
  --font:"IBM Plex Sans Arabic"; --dim:0;
  --display:var(--font),system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --body:var(--font),system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--base);color:var(--ink)}
html{font-size:16px}
body{font-family:var(--body);font-size:1rem;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:transparent}
button{font:inherit;color:inherit}
#bg{position:fixed;inset:0;z-index:0;background:var(--base) center/cover no-repeat;transition:background-image .4s}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,var(--dim)),rgba(0,0,0,var(--dim))),linear-gradient(to bottom,rgba(0,0,0,.30),rgba(0,0,0,.06) 38%,rgba(0,0,0,.10) 70%,rgba(0,0,0,.45))}
.app{position:relative;z-index:1}
.page{max-width:560px;margin:0 auto;min-height:100vh;padding-block:14px calc(170px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;animation:pageIn .35s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar-top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ib svg{width:22px;height:22px}
.back{border:0;background:transparent;color:var(--ink);display:inline-flex;align-items:center;gap:4px;cursor:pointer;font-size:1rem;padding:8px 0;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.back svg{width:20px;height:20px}
.hero{text-shadow:0 2px 14px rgba(0,0,0,.35)}
.hero .eyebrow{font-size:.9rem;opacity:.9}
.hero h1{font-family:var(--display);font-weight:700;font-size:2.1rem;line-height:1.25;margin:0}
.hero .date{font-size:1.05rem;opacity:.92;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip-s{display:inline-flex;gap:4px;align-items:center;font-size:.8rem;padding:2px 10px;border-radius:99px;background:rgba(0,0,0,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-variant-numeric:tabular-nums;text-shadow:none}
.prog{height:4px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .5s}
.cards{display:flex;flex-direction:column;gap:6px}
.card{background:var(--glass);backdrop-filter:blur(18px) saturate(1.15);-webkit-backdrop-filter:blur(18px) saturate(1.15);border-radius:14px;border:1px solid var(--faint)}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;animation:rowIn .3s ease both}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.task.leaving{animation:rowOut .4s ease forwards}
@keyframes rowOut{to{opacity:0;transform:translateX(-40px)}}
.task.dragging{background:var(--glass-hi);box-shadow:0 10px 30px rgba(0,0,0,.4);position:relative;z-index:3}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--on-accent);transition:all .2s}
.ck svg{width:14px;height:14px;opacity:0;transition:opacity .2s}
.done>.ck,.ck.on{background:var(--accent);border-color:var(--accent)} .done>.ck svg,.ck.on svg{opacity:1}
.ck.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.25)}}
.bullet{flex:none;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45);margin:0 9px}
.tb{flex:1;min-width:0;border:0;background:transparent;text-align:right;cursor:pointer;padding:0;display:flex;flex-direction:column;gap:2px}
.tt{overflow-wrap:anywhere}
.done .tt{color:var(--muted);text-decoration:line-through}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.74rem;font-variant-numeric:tabular-nums}
.meta span{display:inline-flex;gap:4px;align-items:center}
.meta svg{width:12px;height:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));display:inline-block}
.star{flex:none;width:36px;height:36px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted);border-radius:50%}
.star svg{width:21px;height:21px}
.star.on{color:var(--star)} .star.on svg{fill:var(--star)}
.handle{flex:none;width:34px;height:34px;border:0;background:rgba(255,255,255,.08);border-radius:10px;display:grid;place-items:center;cursor:grab;touch-action:none;color:var(--muted)}
.handle svg{width:16px;height:16px}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:center}
.empty b{color:var(--ink);font-weight:500}
.empty .em{font-size:1.8rem}
.note-strip{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;font-size:.88rem}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn.sm{padding:6px 14px;font-size:.85rem;border-radius:10px}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--ink)}
.btn.wide{width:100%}
.addbar{position:fixed;z-index:19;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.addbar button{max-width:560px;margin:0 auto;width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--faint);border-radius:14px;background:var(--glass-hi);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);cursor:pointer;color:var(--ink);font-size:1rem;text-align:right}
.addbar svg{width:22px;height:22px;color:var(--accent)}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(16,19,20,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--faint);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;cursor:pointer;color:var(--muted);font-size:.7rem;position:relative;min-width:0}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent);font-weight:600}
.badge{position:absolute;top:1px;left:calc(50% - 22px);min-width:17px;height:17px;border-radius:99px;background:var(--warm);color:#2A1404;font-size:.64rem;display:grid;place-items:center;padding:0 4px;font-weight:700}
/* overlay views (detail, day editor) */
.view{position:fixed;inset:0;z-index:30;overflow-y:auto;transform:translateX(-100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.view.in{transform:none}
.view .vbg{position:fixed;inset:0;background:var(--sheet)}
.view .page{position:relative;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));animation:none}
.drow{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--faint);min-height:56px}
.drow:last-child{border-bottom:0}
.drow>svg{width:22px;height:22px;color:var(--muted);flex:none}
.drow .lbl{flex:1;color:var(--muted);min-width:0}
.drow.on .lbl{color:var(--accent)}
.title-in{flex:1;min-width:0;font:inherit;font-family:var(--display);font-size:1.3rem;font-weight:600;background:transparent;border:0;color:var(--ink);padding:4px 0}
.inp{font:inherit;width:100%;min-width:0;padding:11px 13px;border-radius:12px;border:1px solid var(--faint);background:var(--field);color:var(--ink)}
.inp.bare{border:0;background:transparent;padding:0}
textarea.inp{min-height:90px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid rgba(255,255,255,.14);background:transparent;border-radius:99px;padding:6px 12px;font-size:.85rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.step{display:flex;gap:12px;align-items:center;padding:8px 16px}
.step .ck{width:22px;height:22px}.step .ck svg{width:11px;height:11px}
.step span{flex:1;min-width:0;overflow-wrap:anywhere}
.step.done span{color:var(--muted);text-decoration:line-through}
.x{border:0;background:transparent;color:var(--muted);font-size:1.25rem;cursor:pointer;padding:2px 8px}
.foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.85rem;padding:8px 4px}
.trash{border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:8px;border-radius:10px}
.trash.sure{color:var(--danger);background:rgba(255,140,124,.12)}
.trash svg{width:22px;height:22px}
/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;transition:opacity .2s}
.scrim.in{opacity:1}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;margin-inline:auto;max-width:560px;max-height:86vh;overflow-y:auto;background:var(--sheet);border-radius:24px 24px 0 0;padding-top:8px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px}
.sheet.in{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:rgba(255,255,255,.2);margin:0 auto 2px}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-head h3{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:0}
.done-link{border:0;background:transparent;color:var(--accent);font-weight:600;cursor:pointer;padding:6px}
.mi{width:100%;border:0;background:transparent;display:flex;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--faint);cursor:pointer;text-align:right;font-size:1rem}
.mi:last-child{border-bottom:0}
.mi svg{width:21px;height:21px;color:var(--muted);flex:none}
.mi.danger,.mi.danger svg{color:var(--danger)}
.seg{display:flex;gap:6px;background:rgba(255,255,255,.06);padding:4px;border-radius:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;cursor:pointer;color:var(--muted);font-size:.9rem}
.seg button.on{background:rgba(255,255,255,.14);color:var(--ink);font-weight:600}
.swatches{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory}
.sw{flex:none;width:62px;height:62px;border-radius:50%;border:3px solid transparent;cursor:pointer;background:center/cover;scroll-snap-align:start;padding:0}
.sw.on{border-color:var(--ink)}
.flabel{font-size:.8rem;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.frow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.frow>*{flex:1 1 120px;min-width:0}
/* settings */
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--faint);min-height:56px}
.srow:last-child{border-bottom:0}
.srow .sl{display:flex;flex-direction:column;min-width:0}
.srow .sl small{color:var(--muted);font-size:.78rem}
.sw2{flex:none;width:50px;height:30px;border-radius:99px;border:0;background:rgba(255,255,255,.18);position:relative;cursor:pointer;transition:background .2s;padding:0}
.sw2::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw2.on{background:var(--accent)} .sw2.on::after{transform:translateX(-20px)}
.sec{font-size:.8rem;color:var(--ink);opacity:.85;margin:6px 4px -6px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.fontopt{border:1px solid rgba(255,255,255,.14);background:transparent;border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink);text-align:right;display:flex;flex-direction:column;gap:2px;min-width:0}
.fontopt.on{border-color:var(--accent);background:rgba(114,221,180,.1)}
.fontopt b{font-size:1.05rem}
.fontopt small{color:var(--muted);font-size:.75rem}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.acc{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.acc.on{border-color:var(--ink)}
input[type=range]{width:140px;accent-color:var(--accent)}
/* planner */
.dayc{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;border:1px solid var(--faint);text-align:right;width:100%;color:var(--ink)}
.dayc .nm{font-family:var(--display);font-size:1.05rem;font-weight:600;min-width:72px}

.grp-h{font-size:.85rem;color:var(--ink);opacity:.9;margin:6px 4px 0;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.swipe{position:relative;border-radius:14px;overflow:hidden}

.swipe .act svg{width:20px;height:20px}

.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.col .pv{font-size:.66rem;font-variant-numeric:tabular-nums}
.ins{display:flex;gap:12px;align-items:center}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:rgba(245,248,247,.95);color:#122019;padding:10px 18px;border-radius:99px;font-size:.9rem;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.in{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;z-index:70;pointer-events:none;width:100%;height:100%}
button:focus-visible,.inp:focus-visible,.title-in:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:370px){.hero h1{font-size:2.1rem}.tab{font-size:.62rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* ===== ثوابت وأيقونات ===== */
const DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const SHORT=["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];

/* ===== السحب للترتيب ===== */
function dragifyArr(handle,row,get,set){
  handle.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();const list=row.parentNode;handle.setPointerCapture(e.pointerId);row.classList.add("dragging");
    const move=ev=>{const y=ev.clientY,sib=[...list.children].filter(x=>x!==row&&x.dataset.id),after=sib.find(x=>{const r=x.getBoundingClientRect();return y<r.top+r.height/2});
      if(after){if(row.nextSibling!==after)list.insertBefore(row,after)}else if(list.lastChild!==row)list.appendChild(row)};
    const up=()=>{handle.removeEventListener("pointermove",move);handle.removeEventListener("pointerup",up);handle.removeEventListener("pointercancel",up);row.classList.remove("dragging");
      const order=[...list.children].map(x=>x.dataset.id).filter(Boolean),arr=get(),map=Object.fromEntries(arr.map(x=>[x.id,x]));
      set([...order.map(i=>map[i]).filter(Boolean),...arr.filter(x=>!order.includes(x.id))]);save()};
    handle.addEventListener("pointermove",move);handle.addEventListener("pointerup",up);handle.addEventListener("pointercancel",up)});
}

function celebrate(){

  const cv=document.getElementById("confetti");cv.hidden=false;const W=cv.width=innerWidth,H=cv.height=innerHeight,x=cv.getContext("2d");
  const cols=["#72DDB4","#F5A86E","#86A9F0","#B497EC","#F7C95E","#EE8DAA"];
  const P=Array.from({length:120},()=>({x:W/2+(Math.random()-.5)*90,y:H*.6,vx:(Math.random()-.5)*13,vy:-Math.random()*15-6,r:Math.random()*6+4,c:cols[Math.random()*6|0],a:Math.random()*6,s:(Math.random()-.5)*.3}));
  let f=0;(function tk(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.38;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(++f<115)requestAnimationFrame(tk);else{x.clearRect(0,0,W,H);cv.hidden=true}})();
}
